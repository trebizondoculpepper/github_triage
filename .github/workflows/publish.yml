name: Publish
# npm releases (doc/npm-releases.md, #79): publication happens only on explicit request.
# `npm run make-prerelease` dispatches channel=next on main; `npm run release` fast-forwards
# `release` and dispatches channel=latest on it. Pushes never publish.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "next (prerelease, from main) or latest (official release, from release)"
        required: true
        type: choice
        options: [next, latest]
      sha:
        description: "Full commit SHA selected by the helper; must still be the dispatched branch's head"
        required: true
        type: string

permissions:
  contents: read

# One queue per channel, never cancelling a run that may already be publishing.
concurrency:
  group: npm-publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    # Inert until the owner has set up npm trusted publishing and sets the repository
    # variable NPM_PUBLISH to "true" (see doc/npm-releases.md, "Owner setup").
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release for official versions
      id-token: write # npm trusted publishing (OIDC); no npm token is stored
    env:
      CHANNEL: ${{ inputs.channel }}
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Validate before building anything: a wrong channel/branch pairing, a malformed SHA,
      # a branch that moved after the helper chose the SHA, or a commit not on main all fail
      # here, so a different commit is never published silently.
      - name: Validate the request
        run: |
          case "$CHANNEL:$GITHUB_REF_NAME" in
            next:main|latest:release) ;;
            *) echo "::error::channel $CHANNEL must be dispatched on $( [ "$CHANNEL" = next ] && echo main || echo release ), not $GITHUB_REF_NAME."; exit 1 ;;
          esac
          echo "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::sha must be a full 40-character commit SHA."; exit 1; }
          if [ "$GITHUB_SHA" != "$SHA" ]; then
            echo "::error::$GITHUB_REF_NAME is at $GITHUB_SHA, not the requested $SHA (it moved after selection). Nothing was published; make a new explicit request."
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run package-test
      - name: Choose version
        id: version
        run: |
          npx tsx scripts/release-version.ts "$CHANNEL" "$SHA" > version.json
          cat version.json
          echo "version=$(node -p 'require("./version.json").version ?? ""')" >> "$GITHUB_OUTPUT"
          echo "published=$(node -p 'require("./version.json").alreadyPublished ?? ""')" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        id: publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ inputs.channel }}
        run: |
          # The registry's read view can lag a publication by a minute or two (#57). If npm
          # reports the chosen prerelease as taken, move to the next one; never bump `latest`.
          # The request may have waited in the queue: re-check the live branch head immediately
          # before publishing, and refuse if it moved, so an outdated commit is never published.
          live=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$live" != "$SHA" ]; then
            echo "::error::$GITHUB_REF_NAME moved to $live while this request for $SHA was queued. Nothing was published; make a new explicit request."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            npm pkg set gitHead="$SHA"
            if npm publish --provenance --access public --tag "$TAG" 2> publish.err; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat publish.err >&2
            if [ "$TAG" = "next" ] && grep -q "E409" publish.err; then
              VERSION=$(npx tsx scripts/release-version.ts following "$VERSION")
              echo "::notice::Version taken (registry lag); retrying as $VERSION."
              continue
            fi
            exit 1
          done
          echo "::error::No free prerelease version after 5 attempts."
          exit 1
      - name: Tag and GitHub release
        # Also runs when a retry finds the version already published but the release missing.
        if: inputs.channel == 'latest' && (steps.version.outputs.version != '' || steps.version.outputs.published != '')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.version || steps.version.outputs.published }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --generate-notes
          fi

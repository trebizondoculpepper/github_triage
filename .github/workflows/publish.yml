name: Publish
# npm releases (doc/npm-releases.md): verified main builds publish prereleases under `next`;
# commits promoted to the `release` branch publish official versions under `latest`.
on:
  push:
    branches: [main, release]
  # Re-run a release whose run was lost or failed (npm run release does this when release
  # already matches main). Only the release branch is accepted; see "Choose channel".
  workflow_dispatch:

permissions:
  contents: read

# One queue per branch, never cancelling a run that may already be publishing. GitHub keeps
# only one pending run per group, so main pushes replace only older pending main runs (only
# main's head publishes anyway) and can never cancel a pending official release.
concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Inert until the owner has set up npm trusted publishing and sets the repository
    # variable NPM_PUBLISH to "true" (see doc/npm-releases.md, "Owner setup").
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release for official versions
      id-token: write # npm trusted publishing (OIDC); no npm token is stored
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run package-test
      - name: Choose channel
        id: channel
        run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "release" ]; then
            echo "::error::Manual runs are only for the release branch."; exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "release" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::The release commit is not on main."; exit 1; }
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            # A delayed run must not move `next` backwards: publish only main's current head.
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::notice::main has moved on; a newer run publishes."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            echo "channel=next" >> "$GITHUB_OUTPUT"
          fi
      - name: Choose version
        id: version
        if: steps.channel.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          node scripts/release-version.mjs "$CHANNEL" "$GITHUB_SHA" > version.json
          cat version.json
          echo "version=$(node -p 'require("./version.json").version ?? ""')" >> "$GITHUB_OUTPUT"
          echo "published=$(node -p 'require("./version.json").alreadyPublished ?? ""')" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        id: publish
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.channel.outputs.channel }}
        run: |
          # The registry's read view can lag a publication by a minute or two (#57). If npm
          # reports the chosen prerelease as taken, move to the next one; never bump `latest`.
          for attempt in 1 2 3 4 5; do
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            npm pkg set gitHead="$GITHUB_SHA"
            if npm publish --provenance --access public --tag "$TAG" 2> publish.err; then
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat publish.err >&2
            if [ "$TAG" = "next" ] && grep -q "E409" publish.err; then
              VERSION=$(node scripts/release-version.mjs following "$VERSION")
              echo "::notice::Version taken (registry lag); retrying as $VERSION."
              continue
            fi
            exit 1
          done
          echo "::error::No free prerelease version after 5 attempts."
          exit 1
      - name: Tag and GitHub release
        # Also runs when a retry finds the version already published but the release missing.
        if: steps.channel.outputs.channel == 'latest' && (steps.version.outputs.version != '' || steps.version.outputs.published != '')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.version || steps.version.outputs.published }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          fi

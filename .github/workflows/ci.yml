name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded branch/PR runs, but let every main push finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Vite+ tooling needs Node 22+; the CLI itself supports Node 20+.
      - name: Set up tooling Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node == 20 && 22 || matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Set up runtime Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node dist/cli.mjs --help
      - run: node src/cli.js --help
      - run: npm run smoke
      - run: node scripts/smoke.mjs src/cli.js

  # Single stable check name for branch protection and the triage tool's
  # required "verify" check; passes only if every matrix job passed.
  verify:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: test "${{ needs.test.result }}" = "success"

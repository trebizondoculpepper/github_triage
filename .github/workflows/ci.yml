name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded branch/PR runs, but let every main push finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is omitted by owner decision (2026-11-13): it is expected to behave like Linux and
        # its hosted runners queue for long periods. Add it back only when explicitly requested.
        os: [ubuntu-latest, windows-latest]
        # Current Node LTS (doc/design/runtime.md, #108); update deliberately as LTS changes.
        node: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node --version
      - run: node dist/cli.mjs --help
      - run: npx tsx src/cli.ts --help
      - run: npm run smoke
      - run: npx tsx scripts/smoke.ts src/cli.ts
      - run: npm run package-test

  # FreeBSD TRIAL (owner decision, 2026-11-13): runs the same checks inside a FreeBSD VM on an
  # Ubuntu host. Deliberately NOT in `verify`'s needs, so a slow or broken VM cannot block merges.
  # Remove this job if it proves flaky, slow or costly to maintain.
  freebsd:
    name: test (freebsd 15.1, node 26) [trial, non-blocking]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test in FreeBSD VM
        # vmactions/freebsd-vm v1.6.0
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: "15.1"
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y git node26 npm-node26
          run: |
            set -e
            node --version
            npm ci
            npm run check
            npm test
            npm run build
            node dist/cli.mjs --help
            npx tsx src/cli.ts --help
            npm run smoke
            npx tsx scripts/smoke.ts src/cli.ts
            npm run package-test

  # Single stable check name for branch protection and the triage tool's
  # required "verify" check; passes only if every matrix job passed.
  verify:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: test "${{ needs.test.result }}" = "success"
